name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALLOW_LOCAL_DB: "1"
      # Online fee payments use the built-in test checkout; no Paystack keys in CI.
      PAYMENTS_TEST_MODE: "1"
      # Parent sign-in codes appear on screen (no SMS provider in CI). Never set on the live site.
      ALLOW_TEST_LOGIN_CODES: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm db:migrate
      - run: pnpm db:seed && pnpm db:seed-results && pnpm db:seed-fees && pnpm db:seed-comms && pnpm db:seed-timetable && pnpm db:seed-students && pnpm db:seed-teaching
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        run: |
          pnpm start &
          npx wait-on http://localhost:3005/login --timeout 120000
          pnpm test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
